<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TablMarkUNSS Élève</title>
<meta name="theme-color" content="#0a1428">
<meta name="description" content="Table de marque UNSS : saisie en direct des feuilles de match par les jeunes officiels.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TablMark Élève">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: outil de table de marque, direct et lisible au gymnase, dans la famille des applis du portail Mes Apps EPS.
IDEA: le tableau d'affichage lumineux du gymnase + la feuille de match officielle.
PICTURE: le tableau de score (équipes, chrono, score géant) est l'image principale.
COLOUR and TYPE: nuit bleue du portail, orange et bleu du logo TablMarkUNSS (équipe A orange, équipe B bleue) ; titre italique 900 en deux couleurs, chiffres en Barlow Condensed.
LAYOUT: en-tête du portail (logo, titre bicolore, pastille), cartes vitrées, actions par équipe côte à côte ; tout s'empile sous 600px.
*/
:root{color-scheme:dark;--bg:#0a1428;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.11);--ink:#eef3ff;--mute:rgba(238,243,255,.62);--line:rgba(255,255,255,.15);
--c1:#ff8a1f;--c2:#2f9bff;--c3:#ffd27a;--A:#ff7a00;--B:#2f9bff;--Ad:rgba(255,122,0,.18);--Bd:rgba(47,155,255,.2);--board:rgba(4,10,24,.72);
--y:#ffd21f;--o:#ff8a1f;--r:#ff4d5e;--ok:#3ddc84;--gA:linear-gradient(135deg,#ffa21f,#ff5e00);--gB:linear-gradient(135deg,#2f9bff,#0a4fd0);
--cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--sys:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sys);overflow-x:clip;-webkit-tap-highlight-color:transparent;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 8% 4%,rgba(255,138,31,.20),transparent 55%),radial-gradient(ellipse at 94% 96%,rgba(47,155,255,.22),transparent 55%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border-radius:13px;min-height:44px;padding:0 16px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;letter-spacing:.01em;transition:transform .12s,filter .15s,background .15s}
button:hover{filter:brightness(1.14)}button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-p{background:var(--gA);border:0;color:#fff;box-shadow:0 6px 18px rgba(255,94,0,.32),inset 0 1px 0 rgba(255,255,255,.33);text-shadow:0 1px 2px rgba(0,0,0,.2)}

.btn-b{background:var(--gB);border:0;color:#fff;box-shadow:0 6px 18px rgba(10,79,208,.33),inset 0 1px 0 rgba(255,255,255,.33)}
.btn-d{color:#ff8f8f;border-color:rgba(255,143,143,.45)}
input,select,textarea{width:100%;min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:rgba(0,0,0,.32)}
select option{background:#0f1d38;color:var(--ink)}
input::placeholder,textarea::placeholder{color:rgba(238,243,255,.38)}
input[type=checkbox]{accent-color:var(--c1)}
textarea{min-height:90px;resize:vertical}
/* En-tête façon portail */
.top{position:sticky;top:0;z-index:20;background:rgba(10,20,40,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px 14px;padding:10px max(3vw,12px) 12px;flex-wrap:wrap}
.top::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c1) 18%,var(--c3) 55%,var(--c2) 85%,transparent)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit;text-align:left;min-height:0}

.brand img{width:46px;height:46px;border-radius:22%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.3),0 0 22px rgba(255,138,31,.45),0 6px 16px rgba(0,0,0,.4);transition:transform .3s}
.brand:hover img{transform:rotate(-5deg) scale(1.05)}
.brand h1{margin:0;font:italic 900 1.45rem/1.08 var(--sys);letter-spacing:.005em;color:#fff;text-shadow:0 2px 0 #06122e,0 4px 12px rgba(0,0,0,.45);white-space:nowrap}
.brand h1 .t2{background:linear-gradient(180deg,var(--c3),var(--c1) 70%);-webkit-background-clip:text;background-clip:text;color:var(--c1);-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #06122e)}
.brand h1 .pill{font:normal 800 .55em var(--sys);vertical-align:middle;background:var(--gB);color:#fff;padding:2px 9px;border-radius:999px;border:1.5px solid #8ec9ff;margin-left:4px;text-shadow:none}
.brand p{margin:1px 0 0;font-size:.7rem;font-weight:600;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:13px;padding:9px 14px;background:var(--panel);white-space:nowrap}
.back:hover{filter:brightness(1.2)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav button{flex:none;background:transparent;border:0;color:var(--mute);white-space:nowrap;padding:0 12px;border-radius:999px}
.nav button:hover{color:var(--ink);background:var(--panel)}
.nav button.on{color:#fff;background:var(--gB);box-shadow:0 4px 14px rgba(10,79,208,.4)}
main{max-width:1240px;margin:auto;padding:18px max(3vw,12px) 96px}
h1{font:italic 900 clamp(30px,4.6vw,44px)/1.06 var(--sys);margin:8px 0 6px;text-wrap:balance;letter-spacing:-.005em}
h2{margin:22px 0 10px;font:800 .85rem var(--sys);letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}
h3{font:800 1.05rem/1.2 var(--sys);margin:0 0 10px}
.lead{color:var(--mute);max-width:65ch;margin:0 0 16px}
.card{position:relative;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09)}
.card>h3:first-child{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.f{display:grid;gap:5px}.f span{font-size:.8rem;color:var(--mute);font-weight:700;letter-spacing:.03em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--mute)}.small{font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.live{background:var(--gA);border-color:transparent;color:#fff}.tag.clos{background:var(--gB);border-color:transparent;color:#fff}.tag.valide{background:linear-gradient(135deg,#3ddc84,#16a05a);border-color:transparent;color:#05220f}
.dotA,.dotB{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--A);margin-right:6px;box-shadow:0 0 8px var(--A)}.dotB{background:var(--B);box-shadow:0 0 8px var(--B)}
.ov{position:fixed;inset:0;background:rgba(2,6,16,.7);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:14px}
.dlg{background:#13203d;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:60;background:#13203d;border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;max-width:min(92vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
#toast.warn{background:var(--gA);border:0;color:#fff}
.scroll{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.list td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list td.num{text-align:right;font:700 18px var(--cond);white-space:nowrap}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:rgba(255,255,255,.05)}
.empty{padding:28px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:20px;background:rgba(255,255,255,.03)}
.storage{background:var(--gA);color:#fff;padding:9px 14px;border-radius:13px;font-weight:700;margin-bottom:12px}
#print{display:none}
@media print{#print{display:block}.top,main,#ov,#toast{display:none!important}body{background:#fff}body::before{display:none}}
@media(max-width:700px){.nav{order:3;width:100%;margin-left:0}.back{margin-left:auto;padding:7px 10px;font-size:13px}.brand p{display:none}.brand h1{font-size:1.2rem}.brand img{width:40px;height:40px}}
@media(max-width:600px){.grid2{grid-template-columns:1fr}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}table.list.stack td{border:0}table.list.stack tr{border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:no-preference){.flash{animation:fl .5s}@keyframes fl{from{transform:scale(1.18)}to{transform:none}}}

.sheet{background:#fff;color:#111;font:13px/1.4 Barlow,Arial,sans-serif;padding:18px;max-width:900px;margin:auto;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:10px}
.sh-brand{font:700 13px 'Barlow Condensed',Arial;letter-spacing:.02em;color:#e05a00}.sheet h2{margin:0;font:700 24px/1.1 'Barlow Condensed',Arial}
.sheet h3{font:700 16px 'Barlow Condensed',Arial;margin:16px 0 6px;border-bottom:1px solid #999}
.sh-st{border:1.5px solid #111;padding:2px 8px;font-weight:700;font-size:12px}
.sh-t,.sh-meta{width:100%;border-collapse:collapse;margin:6px 0}.sh-t th,.sh-t td,.sh-meta th,.sh-meta td{border:1px solid #888;padding:3px 6px;text-align:center}
.sh-meta th{background:#eee;text-align:left;width:16%}.sh-meta td{text-align:left}.sh-t th{background:#eee}.sh-t td.l{text-align:left}
.sh-score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0;border:2px solid #111;padding:8px}
.sh-score small{display:block;color:#555}.sh-score>div:last-child{text-align:right}.sh-big{font:700 40px 'Barlow Condensed',Arial}
.sh-win{margin:4px 0}.sh-small{margin:4px 0;font-size:12px;color:#333}.sh-obs{border:1px solid #888;padding:6px;min-height:36px}
.sh-sig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.sh-sig div{border:1px solid #888;padding:4px;min-height:80px}
.sh-sig span{font-size:11px;display:block}.sh-sig img{width:100%;height:56px;object-fit:contain}.sh-f{margin-top:14px;font-size:11px;color:#555}
@media(max-width:600px){.sh-sig{grid-template-columns:1fr 1fr}.sh-big{font-size:30px}.sh-t{font-size:12px}}
@media print{body *{visibility:hidden}#print,#print *{visibility:visible}#print{position:absolute;inset:0}.sheet{padding:0;box-shadow:none;border-radius:0}}
/* --- Élève --- */
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sports button{min-height:64px;display:grid;place-items:center;text-align:center;font:700 19px/1.1 var(--cond)}
.sports button small{font:400 12px Barlow,Arial;color:var(--mute)}
.sports button.on{background:var(--gB);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(10,79,208,.35)}.sports button.on small{color:inherit;opacity:.7}
.team-h{display:flex;align-items:center;gap:8px}
.pr{display:grid;grid-template-columns:58px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto auto 44px;gap:6px;margin-bottom:6px;align-items:center}
.pr input{min-height:40px;padding:6px 8px}
.ck{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:600}.ck input{width:20px;min-height:20px}
.pr button{padding:0;min-height:40px}
.coachz{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}.coachz .off{grid-template-columns:repeat(3,minmax(0,1fr));margin:0}.coachz .o-nom{grid-column:span 2}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.party{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 44px;gap:6px;margin-bottom:6px}
.off{display:grid;grid-template-columns:150px minmax(0,1.5fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1fr);gap:6px;align-items:center;margin-bottom:8px}
@media(max-width:1100px){.off{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:10px;border-bottom:1px solid var(--line)}.off .ol{grid-column:1/-1;font-weight:700}.off .o-nom{grid-column:span 2}.coachz .off{border:0;padding:0}}
.board{background:var(--board);border:1px solid var(--line);color:#fff;border-radius:22px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;overflow:hidden;box-shadow:0 10px 30px rgb(0 0 0/.25)}
.tm{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tmA{background:linear-gradient(160deg,#ffa21f,#d94a00)}.tmB{background:linear-gradient(200deg,#2f9bff,#0a3fae);text-align:right;align-items:flex-end}
.tn{font:700 clamp(16px,2.4vw,24px)/1.1 var(--cond);overflow-wrap:anywhere}
.ts{font:700 clamp(64px,11vw,128px)/.9 var(--cond);font-variant-numeric:tabular-nums}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills span{background:rgb(0 0 0/.28);border-radius:20px;padding:1px 9px;font-size:13px;white-space:nowrap}
.pills span.hot{background:var(--y);color:#111}
.clk{padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:190px}
.per{display:flex;align-items:center;gap:6px;font:600 16px var(--cond);white-space:nowrap}
.per button,.cbtn button{background:#222a35;border-color:#38424f;color:#fff;min-height:40px;padding:0 10px}
.time{font:700 clamp(44px,7vw,76px)/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.time.run{color:#7ef0a6}
.cbtn{display:flex;gap:6px}.cbtn .play{min-width:64px;font-size:20px;background:var(--gA);border:0;color:#fff}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.pad{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;border-top:6px solid var(--A)}.padB{border-top-color:var(--B)}
.pad h4{margin:0 0 8px;font:700 17px var(--cond)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.act{min-height:58px;font:700 18px/1.05 var(--cond);padding:4px}
.padA .c-p{background:var(--gA);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(255,94,0,.3)}.padB .c-p{background:var(--gB);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(10,79,208,.35)}
.c-y{border-left:8px solid var(--y)}.c-o{border-left:8px solid var(--o)}.c-r{border-left:8px solid var(--r)}.c-f{border-left:8px solid var(--mute)}.c-s{border-left:8px solid var(--ok)}.c-tm{border-style:dashed}
.alerts{display:grid;gap:6px;margin-top:10px}.alert{background:rgba(255,210,31,.13);border:1px solid rgba(255,210,31,.35);border-left:6px solid var(--y);padding:8px 12px;border-radius:8px;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 8px}.tabs button.on{background:var(--gB);color:#fff;border-color:transparent}
.log{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.log li{display:grid;grid-template-columns:86px 28px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.log .lt{font:600 14px var(--cond);color:var(--mute);white-space:nowrap}.log .ls{font:700 17px var(--cond);white-space:nowrap}
.log b.tA,.log b.tB{color:#fff;background:var(--A);border-radius:6px;text-align:center;font-size:13px}.log b.tB{background:var(--B)}
.log button{min-height:36px;padding:0;border:0;color:var(--mute)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(10,20,40,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px max(3vw,12px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:10px 0}
.chip{min-height:64px;display:grid;place-items:center;padding:4px;line-height:1.1}.chip b{font:700 26px var(--cond)}.chip small{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.chip i{font-style:normal;font-size:11px;background:var(--line);border-radius:10px;padding:0 6px}.chip.out{opacity:.45}
.du-parts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.du-parts button{white-space:nowrap}.du-parts button.on{background:var(--gB);color:#fff;border-color:transparent}
.du-tot{font:700 22px var(--cond);text-align:center;margin:6px 0}
.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.zone{border:0;border-radius:18px;color:#fff;min-height:clamp(220px,42vh,380px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;position:relative}
.zA{background:linear-gradient(160deg,#ffa21f,#d94a00);box-shadow:0 10px 30px rgba(255,94,0,.3)}.zB{background:linear-gradient(200deg,#2f9bff,#0a3fae);box-shadow:0 10px 30px rgba(10,79,208,.35)}
.zone .zn{font:700 clamp(16px,2.6vw,26px)/1.1 var(--cond);text-align:center;overflow-wrap:anywhere}
.zone .zs{font:700 clamp(90px,18vw,180px)/.85 var(--cond);font-variant-numeric:tabular-nums}
.zone .zw{background:rgb(0 0 0/.25);border-radius:20px;padding:2px 12px;font-weight:600}
.zone .srv{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgb(255 255 255/.35)}
.zone:disabled{opacity:.6}
.sets{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}.sets span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font:700 18px var(--cond)}
.banner{background:var(--ok);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;margin-top:10px;text-align:center}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.expbig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.expbig button{min-height:96px;display:grid;place-items:center;align-content:center;gap:4px;border-radius:18px;padding:12px}.expbig b{font:italic 900 30px/1 var(--sys)}.expbig span{font-size:13px;font-weight:600;opacity:.92}
.qprog{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25)}.qprog span{display:flex;gap:6px}.qprog i{width:14px;height:14px;border-radius:50%;border:2px solid var(--c2)}.qprog i.ok{background:var(--ok);border-color:var(--ok)}
.qrbox{background:#fff;border-radius:16px;padding:10px;width:min(360px,100%);margin:0 auto 12px}.qrbox svg{display:block;width:100%;height:auto}
.forprof{margin-top:16px;padding:14px;border-radius:16px;border:1px dashed var(--line);background:rgba(0,0,0,.18)}.forprof h3{font-size:.95rem;margin-bottom:4px}
@media(max-width:600px){.expbig{grid-template-columns:1fr}}
.sig{border:1.5px dashed var(--line);border-radius:14px;padding:8px;background:rgba(0,0,0,.25)}
.sig canvas{width:100%;height:110px;touch-action:none;background:#fff;border-radius:6px;display:block}
.sig .row{justify-content:space-between;margin-bottom:4px}.sig .row button{min-height:32px;font-size:13px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;text-align:center}
.res .big{font:700 clamp(54px,10vw,96px)/1 var(--cond)}
.res .nm{font:700 22px/1.1 var(--cond)}
.hist{display:grid;gap:8px}
.hcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--A);border-radius:18px;padding:10px 12px}
.hcard .sc{font:700 30px var(--cond);white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:10px}
.mini{background:var(--board);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.4);color:#fff;border-radius:22px;display:grid;grid-template-columns:1fr auto 1fr;overflow:hidden}
.mini div{padding:16px;font:700 64px/1 var(--cond)}.mini div:first-child{background:var(--gA)}.mini div:last-child{background:var(--gB);text-align:right}.mini .c{font-size:30px;align-self:center;color:#7ef0a6}
.storage{background:var(--o);color:#111;padding:8px 12px;border-radius:10px;font-weight:600;margin-bottom:12px}
@media(max-width:820px){.pr{grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 44px;grid-auto-flow:row dense;padding-bottom:6px;border-bottom:1px solid var(--line)}.pr .n{grid-area:1/1}.pr button{grid-area:1/4}.pr .lic{grid-column:1/3;grid-row:2}}
@media(max-width:600px){.off,.coachz .off{grid-template-columns:repeat(2,minmax(0,1fr))}.off .o-nom,.off .o-etab,.off .o-niv,.coachz .o-nom{grid-column:1/-1}.board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.clk{grid-column:1/-1;order:-1;min-width:0}.tm{padding:10px}
.pads{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.party{grid-template-columns:minmax(0,1fr) 44px}.party input:nth-child(1){grid-column:1/-1}.party input{grid-column:1}.party button{grid-row:2;grid-column:2}
.log li{grid-template-columns:70px 26px minmax(0,1fr) 36px}.log .ls{display:none}.sigs{grid-template-columns:1fr}.res .nm{font-size:17px}}
</style>

<script>
/* ===== TablMarkUNSS — noyau commun (élève + prof) ===== */
const TMU_VERSION = '1.5';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const fmtT = sec => { sec = Math.max(0, Math.round(sec)); return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); };
const fmtDate = d => { if (!d) return ''; const [y, m, j] = d.split('-'); return j ? `${j}/${m}/${y}` : d; };

const NIVEAUX = ['AS / Établissement', 'District', 'Départemental', 'Académique', 'Inter-académique', 'Championnat de France'];
const CATS = ['Benjamins', 'Minimes', 'Cadets', 'Juniors', 'Lycées', 'Collèges', 'Sport partagé'];
const SEXES = ['Filles', 'Garçons', 'Mixte'];
const NIV_JO = ['', 'Établissement', 'District', 'Départemental', 'Académique', 'National', 'International'];
const EXTRA_ROLES = [['coach1', 'Jeune coach équipe A'], ['coach2', 'Jeune coach équipe B'], ['rep1', 'Jeune reporter 1'], ['rep2', 'Jeune reporter 2']];
const COACH = { A: 'coach1', B: 'coach2' }; const isCoach = k => k === 'coach1' || k === 'coach2';
const coachTxt = (s, t) => { const o = (s.officiels || {})[COACH[t]] || {}; return o.nom ? `${esc(o.nom)}${o.lic ? ' · lic. ' + esc(o.lic) : ''}${o.njo ? ' · JO ' + esc(o.njo) : ''}${o.niv ? ' (' + esc(o.niv) + ')' : ''}` : '—'; };
const ROLES = {
  co: [['arb1', 'Arbitre 1'], ['arb2', 'Arbitre 2'], ['sec', 'Secrétaire / marqueur'], ['chr', 'Chronométreur'], ['resp', 'Responsable de table'], ...EXTRA_ROLES],
  du: [['arb1', 'Juge-arbitre'], ['arb2', 'Arbitre'], ['sec', 'Marqueur'], ['resp', 'Responsable de table'], ...EXTRA_ROLES]
};

/* acts : [clé, libellé, points, couleur] — couleur : y jaune, o orange, r rouge, f faute, s remplacement */
const HAND_ACTS = [['but', 'But', 1], ['b7', 'But 7 m', 1], ['av', 'Avertissement', 0, 'y'], ['2m', '2 min', 0, 'o'], ['dq', 'Disqualif.', 0, 'r']];
const SPORTS = {
  handball: { nom: 'Handball', kind: 'co', periods: 2, pn: 'Mi-temps', dur: 20, ot: 5, maxJ: 14, tm: 3, acts: HAND_ACTS, max2m: 3 },
  hand4: { nom: 'Hand à 4', kind: 'co', periods: 2, pn: 'Période', dur: 10, ot: 3, maxJ: 8, tm: 2, acts: HAND_ACTS, max2m: 3 },
  futsal: { nom: 'Futsal', kind: 'co', periods: 2, pn: 'Mi-temps', dur: 20, ot: 5, maxJ: 12, tm: 2,
    acts: [['but', 'But', 1], ['f', 'Faute', 0, 'f'], ['cj', 'Carton jaune', 0, 'y'], ['cr', 'Carton rouge', 0, 'r']],
    teamFoul: { keys: ['f'], limit: 5, msg: '5 fautes cumulées : dès la 6e, coup franc direct sans mur.' } },
  basket: { nom: 'Basketball', kind: 'co', periods: 4, pn: 'Quart-temps', dur: 10, ot: 5, maxJ: 12, tm: 5, running: true,
    acts: [['p1', '1 pt', 1], ['p2', '2 pts', 2], ['p3', '3 pts', 3], ['f', 'Faute P', 0, 'f'], ['ft', 'Faute T', 0, 'y'], ['fu', 'Faute U', 0, 'o'], ['fd', 'Faute D', 0, 'r']],
    persoKeys: ['f', 'ft', 'fu', 'fd'], persoMax: 5,
    teamFoul: { keys: ['f', 'ft', 'fu', 'fd'], limit: 4, msg: '4 fautes d’équipe dans le quart-temps : lancers francs dès la 5e.' } },
  b3x3: { nom: 'Basket 3×3', kind: 'co', periods: 1, pn: 'Période', dur: 10, ot: 0, maxJ: 4, tm: 1, running: true, target: 21,
    acts: [['p1', '1 pt', 1], ['p2', '2 pts', 2], ['f', 'Faute', 0, 'f'], ['ft', 'Faute T', 0, 'y'], ['fu', 'Faute U', 0, 'o']],
    teamFoul: { keys: ['f', 'ft', 'fu'], limit: 6, msg: '6 fautes d’équipe : 2 lancers francs dès la 7e.' }, cumulFoul: true },
  football: { nom: 'Football', kind: 'co', periods: 2, pn: 'Mi-temps', dur: 30, ot: 10, maxJ: 16, tm: 0,
    acts: [['but', 'But', 1], ['cj', 'Carton jaune', 0, 'y'], ['cr', 'Carton rouge', 0, 'r'], ['rp', 'Entrée (rempl.)', 0, 's']] },
  badminton: { nom: 'Badminton', kind: 'du', pts: 21, max: 30, sets: 2, serve: 'bad',
    formats: { 'Match simple': ['Simple'], 'Match double': ['Double'], 'Rencontre par équipes': ['Simple fille', 'Simple garçon', 'Double filles', 'Double garçons', 'Double mixte'] } },
  tt: { nom: 'Tennis de table', kind: 'du', pts: 11, max: 0, sets: 3, serve: 'tt',
    formats: { 'Match simple': ['Simple'], 'Match double': ['Double'], 'Rencontre par équipes': ['Simple 1', 'Simple 2', 'Double', 'Simple 3', 'Simple 4'] } }
};
const actOf = (s, k) => (SPORTS[s.sport].acts || []).find(a => a[0] === k) || [k, k === 'tm' ? 'Temps mort' : k, 0];
const periodName = (s, p) => p <= s.cfg.periods ? `${SPORTS[s.sport].pn} ${p}` : `Prolong. ${p - s.cfg.periods}`;

/* ---------- Création d'une feuille vierge (élève et prof) ---------- */
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
function cfgFor(sport) {
  const sp = SPORTS[sport];
  return sp.kind === 'co' ? { periods: sp.periods, dur: sp.dur, ot: sp.ot, tm: sp.tm } : { pts: sp.pts, max: sp.max, sets: sp.sets, format: 'Match simple' };
}
function mkParties(sport, fmt) { return (SPORTS[sport].formats[fmt] || ['Simple']).map(l => ({ lab: l, a: '', b: '', h: [], first: 'A', forfeit: '' })); }
function blankSheet(sport) {
  const sp = SPORTS[sport], cfg = cfgFor(sport);
  return { id: uid(), v: 1, sport, status: 'prep', created: Date.now(), updated: Date.now(),
    meta: { comp: '', niveau: 'District', date: today(), heure: '', lieu: '', cat: 'Minimes', sexe: 'Mixte', num: '', poule: '' },
    teams: { A: { nom: '', as: '', prof: '', players: [] }, B: { nom: '', as: '', prof: '', players: [] } },
    officiels: {}, cfg, events: [], period: 1, clock: { rem: (cfg.dur || 0) * 60, run: false, at: 0 },
    parties: sp.kind === 'du' ? mkParties(sport, cfg.format) : [], obs: '', sig: {}, tab: { A: '', B: '' }, forfait: '' };
}

/* ---------- Collectif : calculs ---------- */
function coScore(s, upto) {
  const sc = { A: 0, B: 0 };
  for (const e of s.events) { if (upto && e === upto) { sc[e.team] += e.pts || 0; break; } sc[e.team] += e.pts || 0; }
  return sc;
}
function coRunning(s) { // score après chaque événement
  const sc = { A: 0, B: 0 }; return s.events.map(e => { sc[e.team] += e.pts || 0; return { A: sc.A, B: sc.B }; });
}
function coPeriodScores(s) {
  if (s.summary && s.summary.per && !s.events.length) return s.summary.per.map((x, i) => ({ p: i + 1, A: +x.A || 0, B: +x.B || 0 }));
  const n = Math.max(s.cfg.periods, s.period || 1, ...s.events.map(e => e.p));
  const r = []; for (let p = 1; p <= n; p++) r.push({ p, A: 0, B: 0 });
  for (const e of s.events) r[e.p - 1][e.team] += e.pts || 0;
  return r;
}
function playerStats(s, team) {
  const map = {};
  for (const j of s.teams[team].players) map[j.n] = { j, pts: 0, c: {} };

function vDuel(s) {

}
function point(w) {
  const s = cur(), sp = SPORTS[s.sport], p = s.parties[party]; const before = duelState(p, s.cfg, sp.serve);
  if (before.done || s.status === 'clos') return;
  p.h.push(w); if (s.status === 'prep') s.status = 'live'; save(); render();
  const st = duelState(p, s.cfg, sp.serve); document.getElementById('sc' + w)?.classList.add('flash');
  const nm = t => t === 'A' ? (p.a || teamLabel(s, 'A')) : (p.b || teamLabel(s, 'B'));
  if (st.done) return toast(`Partie terminée : ${nm(st.winner)} gagne ${st.wa}–${st.wb}.`, true);
  if (st.sets.length > before.sets.length) { const x = st.sets.at(-1); return toast(`Set gagné par ${nm(x[0] > x[1] ? 'A' : 'B')} (${x[0]}-${x[1]}). Changement de côté.`, true); }

function initSigs(s) {

    let down = false; const P = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    c.onpointerdown = e => { down = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...P(e)); };
    c.onpointermove = e => { if (!down) return; x.lineTo(...P(e)); x.stroke(); };
    c.onpointerup = c.onpointercancel = () => { if (!down) return; down = false; const sm = document.createElement('canvas'); sm.width = 300; sm.height = 110; sm.getContext('2d').drawImage(c, 0, 0, 300, 110); s.sig[k] = sm.toDataURL('image/png'); save(); };
  }
}
function vSheet(s) { return `<div class="row" style="justify-content:flex-end;margin-bottom:10px"><button class="btn-p" data-act="pdf">PDF</button><button class="btn-b" data-act="xlsx">Excel</button><button data-act="print">Imprimer</button></div><div style="border-radius:12px;overflow:hidden">${sheetHTML(s)}</div>`; }

/* ---------- Chrono ---------- */
function tick() { const s = cur(); const el = document.getElementById('clock'); if (!s || !el) return; const r = remain(s); el.textContent = fmtT(r);
  if (s.clock.run && r <= 0) { s.clock.run = false; s.clock.rem = 0; save(); render(); toast(`Fin : ${periodName(s, s.period)}`, true); } }
setInterval(tick, 250);

/* ---------- Événements ---------- */
function parseList(txt) {
  return txt.split(/\n/).map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(\d{1,3})?[\s;,.\-]*(.*)$/); let tk = m[2].split(/[\s;,\t]+/).filter(Boolean);
    const li = tk.findIndex(x => /^\d{5,}$/.test(x)); const lic = li >= 0 ? tk.splice(li, 1)[0] : '';
    return { n: m[1] || '', nom: (tk[0] || '').toUpperCase(), prenom: tk.slice(1).join(' '), lic, cap: false, gb: false }; });
}
document.addEventListener('input', e => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return; const s = cur(); if (!s) return;
  let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value; if (e.target.hasAttribute('data-num')) v = v === '' ? '' : +v;
  setPath(s, b, v);
  if (b === 'cfg.dur' && !played(s) && s.period === 1) s.clock = { rem: (+v || 0) * 60, run: false, at: 0 };
  if (e.target.hasAttribute('data-format')) { s.parties = mkParties(s.sport, v); party = 0; save(); render(); return; }
  save();
  if (/^teams\.[AB]\.nom$|^forfait$|^tab\./.test(b) && e.type === 'input' && e.target.tagName === 'SELECT') render();
});
document.addEventListener('change', async e => {
  if (e.target.id === 'prepPhoto' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; try { window.__prepFeed(await qrFromImage(f)); } catch (x) { toast('Photo illisible : ' + x.message, true); } return; } const b = e.target.dataset && e.target.dataset.bind; if (b && /^(forfait|tab\.)/.test(b)) render(); });
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, s = cur();
  if (a === 'ovbg') { if (e.target === el) ov(''); return; }
  const d = el.dataset;
  switch (a) {
    case 'home': go('home'); break;
    case 'new': newSheet(); break;
    case 'imp': ov(`<h3>Importer une feuille préparée par le prof</h3><button class="btn-b" data-act="scanprep" style="width:100%;min-height:56px;margin:4px 0 12px">Scanner le QR code du prof</button><p class="small muted">…ou ouvre le fichier reçu (.json), ou colle le code reçu.</p><input type="file" id="impfile" accept=".json,application/json,text/plain"><label class="f" style="margin-top:10px"><span>…ou colle le code</span><textarea id="impcode" placeholder="TMU1:…"></textarea></label><div class="row" style="justify-content:flex-end;margin-top:10px"><button data-act="close">Annuler</button><button class="btn-p" data-act="doimp">Importer</button></div>`); break;
    case 'scanprep': { const col = prepCollector();
      ov(`<h3>Scanner le QR code du prof</h3><video id="scanV" playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
      <div class="qprog" id="qprog"><b>En attente du premier QR code…</b></div><p class="small muted" id="scanMsg">Vise l’écran du prof. Si la feuille tient en plusieurs QR codes, ils défilent tout seuls : garde la tablette pointée.</p>
      <div class="row" style="justify-content:space-between"><button data-act="prepphoto">Utiliser une photo du QR code</button><button data-act="close">Fermer</button></div><input type="file" id="prepPhoto" accept="image/*" capture="environment" hidden>`);
      window.__prepFeed = txt => { let r; try { r = col(txt); } catch (x) { return toast(x.message, true); }
        if (!r.done) { $('#qprog').innerHTML = `<b>QR code ${r.got} / ${r.n} reçu</b><span>${Array.from({ length: r.n }, (_, i) => `<i class="${r.missing.includes(i + 1) ? '' : 'ok'}"></i>`).join('')}</span>`; try { navigator.vibrate && navigator.vibrate(60); } catch (x) { } return; }
        ov(''); importPrep(r.sheet); };
      try { window.__stopCam = await startCamScan($('#scanV'), t => window.__prepFeed(t)); }
      catch (x) { const m = $('#scanMsg'); if (m) m.textContent = 'La caméra n’est pas accessible. Autorise-la dans le navigateur, ou prends chaque QR code en photo avec « Utiliser une photo ».'; } } break;
    case 'prepphoto': $('#prepPhoto').click(); break;
    case 'doimp': { let o; try { const f = $('#impfile').files[0]; o = fromCode(f ? await f.text() : $('#impcode').value); } catch (x) { return toast('Fichier ou code non reconnu.', true); }
      if (!validSheet(o)) return toast('Ce n’est pas une feuille TablMarkUNSS.', true);
      const put = () => { o.updated = Date.now(); o.events = o.events || []; o.parties = o.parties || []; o.sig = o.sig || {}; DB.sheets[o.id] = o; DB.cur = o.id; save(); ov(''); go(o.status === 'clos' ? 'end' : 'setup'); toast('Feuille importée : complète les numéros de maillot.'); };
      if (DB.sheets[o.id]) ask('Cette feuille existe déjà sur la tablette. La remplacer ?', 'Remplacer', put); else put(); } break;
    case 'open': DB.cur = d.id; save(); { const t = cur(); go(t.status === 'prep' ? 'setup' : t.status === 'clos' ? 'end' : 'live'); } break;
    case 'del': ask('Supprimer définitivement cette feuille ?', 'Supprimer', () => { delete DB.sheets[d.id]; if (DB.cur === d.id) DB.cur = null; save(); render(); }); break;
    case 'confirm': { const f = pending; pending = null; ov(''); f && f(); } break;
    case 'close': ov(''); break;
    case 'go': go(d.v); break;
    case 'sport': setSport(s, d.v); save(); render(); break;
    case 'addp': if (s.teams[d.t].players.length >= SPORTS[s.sport].maxJ) toast(`Maximum ${SPORTS[s.sport].maxJ} joueurs inscrits.`, true); s.teams[d.t].players.push({ n: '', nom: '', prenom: '', lic: '', cap: false, gb: false }); save(); render(); break;
    case 'delp': s.teams[d.t].players.splice(+d.i, 1); save(); render(); break;
    case 'paste': ov(`<h3>Coller la liste — équipe ${d.t}</h3><p class="small muted">Une ligne par joueur : numéro, nom, prénom, licence (facultative). Exemple : 7 MARTIN Léa 1234567</p><textarea id="plist" style="min-height:180px"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button data-act="close">Annuler</button><button class="btn-p" data-act="dopaste" data-t="${d.t}">Ajouter</button></div>`); break;
    case 'dopaste': { const L = parseList($('#plist').value); s.teams[d.t].players.push(...L); save(); ov(''); render(); toast(`${L.length} joueur(s) ajouté(s)`); } break;
    case 'addparty': s.parties.push({ lab: 'Partie ' + (s.parties.length + 1), a: '', b: '', h: [], first: 'A', forfeit: '' }); save(); render(); break;
    case 'delparty': s.parties.splice(+d.i, 1); save(); render(); break;
    case 'clock': if (s.status === 'clos') return toast('Feuille clôturée.', true); if (s.clock.run) { s.clock.rem = Math.max(0, remain(s)); s.clock.run = false; } else { if (s.clock.rem <= 0) return toast('Période terminée : passe à la suivante avec ›', true); s.clock.at = Date.now(); s.clock.run = true; if (s.status === 'prep') s.status = 'live'; } save(); render(); break;
    case 'adj': { const r = Math.max(0, remain(s)); s.clock.rem = Math.min(pDur(s, s.period) || 3600, Math.max(0, r + +d.v)); if (s.clock.run) s.clock.at = Date.now(); save(); tick(); } break;
    case 'per': { const np = s.period + +d.v; if (np < 1) return; const doIt = () => { s.period = np; s.clock = { rem: pDur(s, np), run: false, at: 0 }; save(); render(); toast(periodName(s, np)); };
      if (np > s.cfg.periods && d.v === '1') ask(`Passer en prolongation (${s.cfg.ot || s.cfg.dur} min) ?`, 'Oui', doIt); else doIt(); } break;
    case 'pick': openPicker(d.t, d.k); break;
    case 'rec': record(d.t, d.k, d.n ?? ''); break;
    case 'recn': { const n = $('#pkn').value.trim(); if (!n) return $('#pkn').focus(); record(d.t, d.k, n); } break;
    case 'dele': ask('Supprimer cette action du journal ?', 'Supprimer', () => { s.events = s.events.filter(x => x.id !== d.id); save(); render(); }); break;
    case 'undo': { const l = s.events.at(-1); if (!l) return; s.events.pop(); save(); render(); toast('Annulé : ' + actOf(s, l.k)[1] + ' ' + teamLabel(s, l.team)); } break;
    case 'tab': tab = d.v; render(); break;
    case 'swap': swap = !swap; render(); break;
    case 'party': party = +d.i; render(); break;
    case 'pt': point(d.w); break;
    case 'undopt': { const p = s.parties[party]; if (p.forfeit) p.forfeit = ''; else p.h.pop(); save(); render(); } break;
    case 'first': s.parties[party].first = d.v; save(); render(); break;
    case 'ff': { const p = s.parties[party]; if (p.forfeit) { p.forfeit = ''; save(); render(); break; }
      ov(`<h3>Forfait ou abandon — ${esc(p.lab)}</h3><p class="small muted">Qui abandonne ?</p><div class="row"><button data-act="doff" data-v="A">${esc(p.a || teamLabel(s, 'A'))}</button><button data-act="doff" data-v="B">${esc(p.b || teamLabel(s, 'B'))}</button><button data-act="close">Annuler</button></div>`); } break;
    case 'doff': s.parties[party].forfeit = d.v; save(); ov(''); render(); break;
    case 'clrsig': delete s.sig[d.k]; save(); render(); break;
    case 'close-sheet': { const miss = SIGS.filter(([k]) => !s.sig[k]).length; const go2 = () => { if (s.clock.run) { s.clock.rem = Math.max(0, remain(s)); s.clock.run = false; } s.status = 'clos'; s.closedAt = Date.now(); save(); render(); toast('Feuille clôturée. Envoie-la à ton professeur.'); };
      ask(miss ? `${miss} signature(s) manquante(s). Clôturer quand même ?` : 'Clôturer la feuille ? Elle ne sera plus modifiable.', 'Clôturer', go2); } break;
    case 'reopen': ask('Rouvrir la feuille pour la corriger ?', 'Rouvrir', () => { s.status = 'live'; s.closedAt = null; save(); render(); }); break;
    case 'dl': { const r = await saveFile('Pour-le-prof_' + fileName(s, 'json'), JSON.stringify({ ...s, exportedAt: Date.now(), app: 'TablMarkUNSS-eleve' })); toast(r === 'ok' ? 'Fichier prêt : dépose-le dans l’espace de ton professeur.' : r === 'declined' ? 'Téléchargement annulé.' : 'Téléchargement impossible ici : utilise « Copier le code ».', r !== 'ok'); } break;
    case 'copy': toast(await copyText(toCode(s)) ? 'Code copié : colle-le dans un message à ton professeur.' : 'Copie impossible : ouvre « Afficher le code » et sélectionne-le.', false); break;
    case 'qr': { if (typeof qrcode === 'undefined') return toast('QR code indisponible : utilise le fichier pour le prof.', true);
      let svg; try { qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; const q = qrcode(0, 'M'); q.addData(qrEncode(s), 'Byte'); q.make(); svg = q.createSvgTag({ cellSize: 8, margin: 4, scalable: true }); } catch (x) { return toast('QR code impossible : utilise le fichier pour le prof.', true); }
      const r = result(s); ov(`<h3>QR code pour le professeur</h3><p class="small" style="margin:0 0 10px">${esc(teamLabel(s, 'A'))} <b>${r.A} – ${r.B}</b> ${esc(teamLabel(s, 'B'))}</p><div class="qrbox">${svg}</div>
      <p class="small muted">Le prof ouvre <b>TablMarkUNSS Prof → Feuilles reçues → Scanner un QR code</b> et vise cet écran.</p><p class="small muted">Lecture difficile ? Monte la luminosité de l’écran au maximum et éloigne un peu les appareils.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn-p" data-act="close">Fermer</button></div>`); } break;
    case 'pdf': case 'xlsx': { el.disabled = true; try { const r = await exportSheet(s, a); toast(r === 'ok' ? `Fichier ${a === 'pdf' ? 'PDF' : 'Excel'} prêt.` : r === 'declined' ? 'Téléchargement annulé.' : 'Téléchargement impossible ici.', r !== 'ok'); } catch (x) { toast('Export impossible : ' + x.message, true); } el.disabled = false; } break;
    case 'dlhtml': { const r = await saveFile(fileName(s, 'html'), standaloneSheet(s)); if (r !== 'ok') toast('Téléchargement impossible ici.', true); } break;
    case 'print': $('#print').innerHTML = sheetHTML(s); try { window.print(); } catch (x) { toast('Impression indisponible ici : utilise « Feuille imprimable ».', true); } break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('role') === 'button') e.target.click(); if (e.key === 'Escape') ov(''); if (e.key === 'Enter' && e.target.id === 'pkn') document.querySelector('[data-act=recn]')?.click(); });
if (DB.cur && DB.sheets[DB.cur] && DB.sheets[DB.cur].status === 'live') view = 'live';
render();
}
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
